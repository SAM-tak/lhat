<svg xmlns="http://www.w3.org/2000/svg" width="498" height="184" viewBox="0 0 498 184" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="14">
  <title>Functions and procedures in L^</title>
  <rect x=".5" y=".5" width="497" height="183" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="34" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">discounted</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#ff7b72">f</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">price</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">rate</tspan><tspan fill="#d4d4d4"> { </tspan><tspan fill="#9cdcfe">price</tspan><tspan fill="#d4d4d4"> * (</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#d4d4d4"> - </tspan><tspan fill="#9cdcfe">rate</tspan><tspan fill="#d4d4d4">) }</tspan></text>
  <text x="22" y="76" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">checkout</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#ff7b72">p</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">price</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">rate</tspan><tspan fill="#d4d4d4"> {</tspan></text>
  <text x="22" y="97" xml:space="preserve"><tspan fill="#d4d4d4">    </tspan><tspan fill="#dcdcaa">print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#dcdcaa">discounted</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">price</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">rate</tspan><tspan fill="#d4d4d4">))</tspan></text>
  <text x="22" y="118" xml:space="preserve"><tspan fill="#d4d4d4">}</tspan></text>
  <text x="22" y="160" xml:space="preserve"><tspan fill="#dcdcaa">checkout</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#b5cea8">100</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">0.2</tspan><tspan fill="#d4d4d4">)</tspan></text>
</svg>
