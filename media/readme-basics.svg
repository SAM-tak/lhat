<svg xmlns="http://www.w3.org/2000/svg" width="330" height="226" viewBox="0 0 330 226" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="14">
  <title>Zero-based indexing and compound assignment in L^</title>
  <rect x=".5" y=".5" width="329" height="225" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="34" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">double</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#ff7b72">f</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4"> { </tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4"> * </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#d4d4d4"> }</tspan></text>
  <text x="22" y="55" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">values</tspan><tspan fill="#d4d4d4"> = { </tspan><tspan fill="#b5cea8">10</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">20</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">30</tspan><tspan fill="#d4d4d4"> }</tspan></text>
  <text x="22" y="76" xml:space="preserve"><tspan fill="#ff7b72">var</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">total</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0</tspan></text>
  <text x="22" y="118" xml:space="preserve"><tspan fill="#c586c0">for</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">value</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#c586c0">in</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">values</tspan><tspan fill="#d4d4d4"> {</tspan></text>
  <text x="22" y="139" xml:space="preserve"><tspan fill="#d4d4d4">    </tspan><tspan fill="#9cdcfe">total</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d7ba7d">+=</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#dcdcaa">double</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">value</tspan><tspan fill="#d4d4d4">)</tspan></text>
  <text x="22" y="160" xml:space="preserve"><tspan fill="#d4d4d4">}</tspan></text>
  <text x="22" y="202" xml:space="preserve"><tspan fill="#dcdcaa">print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">values</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">], </tspan><tspan fill="#9cdcfe">total</tspan><tspan fill="#d4d4d4">)  </tspan><tspan fill="#6a9955"># 10 120</tspan></text>
</svg>
