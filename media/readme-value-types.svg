<svg xmlns="http://www.w3.org/2000/svg" width="422" height="184" viewBox="0 0 422 184" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="14">
  <title>Inline value types in L^</title>
  <rect x=".5" y=".5" width="421" height="183" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="34" xml:space="preserve"><tspan fill="#ff7b72">import</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#4ec9b0">std</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">math</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">vector3</tspan></text>
  <text x="22" y="76" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">position</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#4ec9b0">std</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">math</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">vector3</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">new</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#d4d4d4">)</tspan></text>
  <text x="22" y="97" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">velocity</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#4ec9b0">std</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">math</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">vector3</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">new</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">)</tspan></text>
  <text x="22" y="118" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">next</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#9cdcfe">position</tspan><tspan fill="#d4d4d4"> + </tspan><tspan fill="#9cdcfe">velocity</tspan><tspan fill="#d4d4d4"> * </tspan><tspan fill="#b5cea8">0.5</tspan></text>
  <text x="22" y="160" xml:space="preserve"><tspan fill="#dcdcaa">print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">next</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4">)  </tspan><tspan fill="#6a9955"># 2.5</tspan></text>
</svg>
