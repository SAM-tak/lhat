<svg xmlns="http://www.w3.org/2000/svg" width="447" height="268" viewBox="0 0 447 268" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="14">
  <title>Typed error handling in L^</title>
  <rect x=".5" y=".5" width="446" height="267" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="34" xml:space="preserve"><tspan fill="#ff7b72">errordef</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#4ec9b0">MathError</tspan><tspan fill="#d4d4d4"> { </tspan><tspan fill="#4ec9b0">DivisionByZero</tspan><tspan fill="#d4d4d4"> }</tspan></text>
  <text x="22" y="76" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">divide</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#ff7b72">f</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">a</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">b</tspan><tspan fill="#d4d4d4"> {</tspan></text>
  <text x="22" y="97" xml:space="preserve"><tspan fill="#d4d4d4">    </tspan><tspan fill="#c586c0">if</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">b</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4"> {</tspan></text>
  <text x="22" y="118" xml:space="preserve"><tspan fill="#d4d4d4">        </tspan><tspan fill="#c586c0">return</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#4ec9b0">error</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#4ec9b0">MathError</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#4ec9b0">DivisionByZero</tspan><tspan fill="#d4d4d4">{}</tspan></text>
  <text x="22" y="139" xml:space="preserve"><tspan fill="#d4d4d4">    }</tspan></text>
  <text x="22" y="160" xml:space="preserve"><tspan fill="#d4d4d4">    </tspan><tspan fill="#c586c0">return</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">a</tspan><tspan fill="#d4d4d4"> / </tspan><tspan fill="#9cdcfe">b</tspan></text>
  <text x="22" y="181" xml:space="preserve"><tspan fill="#d4d4d4">}</tspan></text>
  <text x="22" y="223" xml:space="preserve"><tspan fill="#ff7b72">let</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#9cdcfe">result</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#dcdcaa">divide</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#b5cea8">10</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">) </tspan><tspan fill="#c586c0">catch</tspan><tspan fill="#888888" fill-opacity=".6">^</tspan><tspan fill="#b5cea8">0</tspan></text>
  <text x="22" y="244" xml:space="preserve"><tspan fill="#dcdcaa">print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">result</tspan><tspan fill="#d4d4d4">)</tspan></text>
</svg>
