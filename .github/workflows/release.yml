# Builds the binaries a release consists of, and attaches them to it.
#
# What ships is the runtime (lhat, which is also the debug adapter of 09) and
# the language server (lhatls). The VSCode extension's own release workflow
# reads these archives and packs them into a platform-specific .vsix, so the
# names here are what it looks for -- lhat-<platform>.zip on Windows and
# lhat-<platform>.tar.gz everywhere else.
name: release

on:
  push:
    tags: ['v*']
  # Buildable without a tag, to check the workflow itself. Nothing is
  # published then: the release step is what a tag adds.
  workflow_dispatch:

permissions:
  contents: write # gh release create, on the tag that started this

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: win32-x64
            os: windows-latest
          - slug: linux-x64
            os: ubuntu-latest
          - slug: linux-arm64
            os: ubuntu-24.04-arm
          # One build answers both Apple targets. The .vsix for darwin-x64
          # and the one for darwin-arm64 carry the same universal binaries.
          - slug: darwin-universal
            os: macos-latest
            extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
    steps:
      - uses: actions/checkout@v5

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Ninja (brew)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset release ${{ matrix.extra }}

      - name: Build
        run: cmake --build --preset release

      # Only what passed goes out. A release built from a tree that fails
      # its own suite is worse than no release.
      - name: Test
        run: ctest --preset release

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          for name in lhat lhatls; do
            if [ -f "build/release/$name.exe" ]; then
              cp "build/release/$name.exe" dist/
            else
              cp "build/release/$name" dist/
            fi
          done
          cp LICENSE dist/
          ls -l dist

      - name: Pack
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "../lhat-${{ matrix.slug }}.zip" .)
          else
            tar -C dist -czf "lhat-${{ matrix.slug }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lhat-${{ matrix.slug }}
          path: lhat-${{ matrix.slug }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A tag is what makes this a release; workflow_dispatch only proves the
    # build still works.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
