# Builds the binaries a release consists of, and attaches them to it.
#
# The command-line runtime (lhat) and language server (lhatls) are separate
# products. The VSCode extension downloads only lhatls-<platform>, while lhat
# stays available as a small standalone way to try the language and as the
# debugger runtime. Both are built and tested from the same source revision.
name: release

on:
  push:
    tags: ['v*']
  # Buildable without a tag, to check the workflow itself. Nothing is
  # published then: the release step is what a tag adds.
  workflow_dispatch:

permissions:
  contents: write # gh release create, on the tag that started this

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: win32-x64
            os: windows-latest
          - slug: linux-x64
            os: ubuntu-latest
          - slug: linux-arm64
            os: ubuntu-24.04-arm
          # One build answers both Apple targets. The .vsix for darwin-x64
          # and the one for darwin-arm64 carry the same universal binaries.
          - slug: darwin-universal
            os: macos-latest
            # Passed through the environment, not interpolated into the
            # command: the ';' that separates a CMake list is also the
            # shell's command separator, and unquoted it runs "x86_64" as a
            # command of its own.
            extra: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
    steps:
      - uses: actions/checkout@v5

      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/devshell.ps1
          $variables = 'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR',
            'VCToolsInstallDir', 'VSINSTALLDIR', 'WindowsSdkDir',
            'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion'
          foreach ($variable in $variables) {
            $value = [Environment]::GetEnvironmentVariable($variable, 'Process')
            if ($null -ne $value) {
              "$variable=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Ninja (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Ninja (brew)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        # ${VAR:+"$VAR"} is "this argument, quoted, or no argument at all" --
        # every target but macOS names no extra, and an empty string would be
        # an argument of its own.
        run: cmake --preset release ${EXTRA:+"$EXTRA"}
        env:
          EXTRA: ${{ matrix.extra }}

      - name: Build
        run: cmake --build --preset release

      # Only what passed goes out. A release built from a tree that fails
      # its own suite is worse than no release.
      - name: Test
        run: ctest --preset release

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist/lhat dist/lhatls
          for name in lhat lhatls; do
            if [ -f "build/release/$name.exe" ]; then
              cp "build/release/$name.exe" "dist/$name/"
            else
              cp "build/release/$name" "dist/$name/"
            fi
            cp LICENSE "dist/$name/"
          done
          ls -l dist
          ls -l dist/lhat dist/lhatls

      - name: Pack
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            for product in lhat lhatls; do
              (cd "dist/$product" && \
                7z a "../../$product-${{ matrix.slug }}.zip" .)
            done
          else
            for product in lhat lhatls; do
              tar -C "dist/$product" -czf \
                "$product-${{ matrix.slug }}.tar.gz" .
            done
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.slug }}
          path: |
            lhat-${{ matrix.slug }}.*
            lhatls-${{ matrix.slug }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A tag is what makes this a release; workflow_dispatch only proves the
    # build still works.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}
